<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1.05em;
        }

        textarea, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: border-color 0.3s;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .shift-container {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .shift-container input {
            flex: 1;
            max-width: 150px;
        }

        .shift-range {
            flex: 1;
        }

        input[type="range"] {
            width: 100%;
            padding: 0;
            height: 6px;
            border: none;
            border-radius: 3px;
            background: #e0e0e0;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            transition: background 0.3s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: #764ba2;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
            transition: background 0.3s;
        }

        input[type="range"]::-moz-range-thumb:hover {
            background: #764ba2;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        button {
            flex: 1;
            padding: 13px;
            font-size: 1.05em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-encrypt {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-encrypt:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-decrypt {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-decrypt:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-copy {
            background: #4CAF50;
            color: white;
            padding: 10px 15px;
            font-size: 0.9em;
        }

        .btn-copy:hover {
            background: #45a049;
        }

        .result-group {
            margin-top: 30px;
        }

        .result-label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1.05em;
        }

        .result-box {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            word-wrap: break-word;
            color: #333;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
        }

        .result-box.success {
            background: #f0f9ff;
            border-color: #667eea;
        }

        .result-box.error {
            background: #ffebee;
            border-color: #f5576c;
            color: #c62828;
        }

        .status-message {
            margin-top: 10px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .status-message.show {
            display: block;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .info-text {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            button {
                font-size: 0.95em;
                padding: 11px;
            }

            .button-group {
                flex-direction: column;
            }
        }

        .loading {
            display: none;
            text-align: center;
            margin: 10px 0;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Caesar Cipher</h1>
        <p class="subtitle">Encrypt and decrypt text with Caesar cipher algorithm</p>

        <div class="form-group">
            <label for="inputText">Text to Process</label>
            <textarea id="inputText" placeholder="Enter your text here..."></textarea>
        </div>

        <div class="form-group">
            <label for="shiftValue">Shift Value: <span id="shiftDisplay">3</span></label>
            <div class="shift-container">
                <input type="number" id="shiftValue" value="3" min="0" max="25">
                <div class="shift-range">
                    <input type="range" id="shiftSlider" value="3" min="0" max="25">
                </div>
            </div>
            <p class="info-text">Use a number from 0-25 or adjust with the slider</p>
        </div>

        <div class="button-group">
            <button class="btn-encrypt" onclick="encryptText()">🔒 Encrypt</button>
            <button class="btn-decrypt" onclick="decryptText()">🔓 Decrypt</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>

        <div class="status-message" id="statusMessage"></div>

        <div class="result-group">
            <label class="result-label">Result</label>
            <div class="result-box" id="resultBox">Your result will appear here...</div>
            <button class="btn-copy" onclick="copyResult()" style="width: 100%; margin-top: 10px;">📋 Copy Result</button>
        </div>
    </div>

    <script>
        // Sync shift input and slider
        const shiftInput = document.getElementById('shiftValue');
        const shiftSlider = document.getElementById('shiftSlider');
        const shiftDisplay = document.getElementById('shiftDisplay');

        shiftInput.addEventListener('input', () => {
            const value = Math.max(0, Math.min(25, parseInt(shiftInput.value) || 0));
            shiftInput.value = value;
            shiftSlider.value = value;
            shiftDisplay.textContent = value;
        });

        shiftSlider.addEventListener('input', () => {
            shiftInput.value = shiftSlider.value;
            shiftDisplay.textContent = shiftSlider.value;
        });

        // Helper function to show status message
        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message show ${type}`;
            setTimeout(() => {
                statusEl.classList.remove('show');
            }, 3000);
        }

        // Encrypt function
        async function encryptText() {
            const text = document.getElementById('inputText').value;
            const shift = parseInt(document.getElementById('shiftValue').value);

            if (!text.trim()) {
                showStatus('Please enter some text to encrypt', 'error');
                return;
            }

            await processText('encrypt', text, shift);
        }

        // Decrypt function
        async function decryptText() {
            const text = document.getElementById('inputText').value;
            const shift = parseInt(document.getElementById('shiftValue').value);

            if (!text.trim()) {
                showStatus('Please enter some text to decrypt', 'error');
                return;
            }

            await processText('decrypt', text, shift);
        }

        // Process text with API
        async function processText(type, text, shift) {
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('resultBox');

            loading.style.display = 'block';
            resultBox.className = 'result-box';

            try {
                const response = await fetch(`/${type}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text, shift })
                });

                const data = await response.json();

                loading.style.display = 'none';

                if (response.ok && data.status === 'success') {
                    resultBox.textContent = data.result;
                    resultBox.className = 'result-box success';
                    showStatus(`Text ${type}ed successfully!`, 'success');
                } else {
                    resultBox.textContent = `Error: ${data.error || 'Unknown error'}`;
                    resultBox.className = 'result-box error';
                    showStatus(`Failed to ${type} text`, 'error');
                }
            } catch (error) {
                loading.style.display = 'none';
                resultBox.textContent = `Error: ${error.message}`;
                resultBox.className = 'result-box error';
                showStatus('Network error occurred', 'error');
            }
        }

        // Copy result to clipboard
        function copyResult() {
            const resultBox = document.getElementById('resultBox');
            const text = resultBox.textContent;

            if (text === 'Your result will appear here...') {
                showStatus('Nothing to copy yet', 'error');
                return;
            }

            navigator.clipboard.writeText(text).then(() => {
                showStatus('Copied to clipboard!', 'success');
            }).catch(() => {
                showStatus('Failed to copy', 'error');
            });
        }

        // Allow Enter key in textarea
        document.getElementById('inputText').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                encryptText();
            }
        });
    </script>
</body>
</html>
